name: Apply Third Hardening Patch
on:
  push:
    branches: [fix/third-hardening-audit-20261014]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: escape Paraphrasing review records') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/third-hardening-audit-20261014
      - name: Escape persisted review records
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'function escapeHtml(value)' not in s:
              marker = 'function renderReview(){'
              helper = """function escapeHtml(value){\n return String(value ?? '')\n  .replace(/&/g,'&amp;')\n  .replace(/</g,'&lt;')\n  .replace(/>/g,'&gt;')\n  .replace(/\\\"/g,'&quot;')\n  .replace(/'/g,'&#39;');\n}\n"""
              if marker not in s:
                  raise SystemExit('renderReview marker not found')
              s = s.replace(marker, helper + marker, 1)
          replacements = {
              '${r.area}': '${escapeHtml(r.area)}',
              '${r.prompt}': '${escapeHtml(r.prompt)}',
              "${r.user||'No answer'}": "${escapeHtml(r.user||'No answer')}",
              "${reviewUnlocked?r.accepted:'Hidden until the whole set is complete'}": "${escapeHtml(reviewUnlocked?r.accepted:'Hidden until the whole set is complete')}",
              "${reviewUnlocked?r.note:'Hidden until the whole set is complete'}": "${escapeHtml(reviewUnlocked?r.note:'Hidden until the whole set is complete')}"
          }
          for old, new in replacements.items():
              if old not in s and new not in s:
                  raise SystemExit(f'expected review interpolation not found: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: escape Paraphrasing review records'
          git push origin HEAD:fix/third-hardening-audit-20261014
