name: Apply Sixth Hardening
on:
  push:
    branches: [fix/sixth-hardening-audit-20261015]
    paths: ['.github/audit6-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sixth-hardening-audit-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Paraphrasing scoring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function countMatchesFlexible')
          end=s.index('function checkExercise3',start)
          new="function hasFlexibleNegation(value){return /(?:^|\\s)(?:not|never|no|without|cannot|can't|cant|isn't|isnt|wasn't|wasnt|didn't|didnt|won't|wont)(?:\\s|$)/.test(normalizeText(value));}\nfunction flexiblePhraseMatch(left,right){\n const l=normalizeText(left), r=normalizeText(right);\n if(!l||!r) return false;\n if(l===r) return true;\n if(hasFlexibleNegation(l)!==hasFlexibleNegation(r)) return false;\n const shorter=l.length<=r.length?l:r, longer=l.length<=r.length?r:l;\n if(!shorter.includes(' ')&&shorter.length<4) return false;\n return (` ${longer} `).includes(` ${shorter} `);\n}\nfunction countMatchesFlexible(givenList, answerGroups){\n let matches=0; const used=new Set();\n answerGroups.forEach(group=>{ for(let i=0;i<givenList.length;i++){ if(used.has(i)) continue; const g=normalizeText(givenList[i]); if(!g) continue; if(group.some(ans=>flexiblePhraseMatch(g,ans))){ used.add(i); matches++; break; } } });\n return matches;\n}\n"
          s=s[:start]+new+s[end:]
          start=s.index('function overlapCount')
          end=s.index('function checkExercise4',start)
          new2="function overlapCount(text, sourceWords){const userWords=new Set(normalizeText(text).split(' ').filter(Boolean)); const sourceUnique=new Set(sourceWords.filter(Boolean)); return Array.from(sourceUnique).filter(w=>w.length>4&&userWords.has(w)).length;}\n"
          s=s[:start]+new2+s[end:]
          p.write_text(s)
          PY
      - run: node --test tests/*.test.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "fix: harden Paraphrasing note and overlap scoring"
          git push
