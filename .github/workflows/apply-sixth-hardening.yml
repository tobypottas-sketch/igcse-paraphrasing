name: Apply Sixth Hardening
on:
  push:
    branches: [fix/sixth-hardening-audit-20261015]
    paths: [.github/audit6-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sixth-hardening-audit-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Paraphrasing scoring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function countMatchesFlexible(givenList, answerGroups){
 let matches=0; const used=new Set();
 answerGroups.forEach(group=>{ for(let i=0;i<givenList.length;i++){ if(used.has(i)) continue; const g=normalizeText(givenList[i]); if(!g) continue; if(group.some(ans=>{const a=normalizeText(ans); return g.includes(a)||a.includes(g);})){ used.add(i); matches++; break; } } });
 return matches;
}
"""
          new="""function hasFlexibleNegation(value){return /(?:^|\\s)(?:not|never|no|without|cannot|can't|cant|isn't|isnt|wasn't|wasnt|didn't|didnt|won't|wont)(?:\\s|$)/.test(normalizeText(value));}
function flexiblePhraseMatch(left,right){
 const l=normalizeText(left), r=normalizeText(right);
 if(!l||!r) return false;
 if(l===r) return true;
 if(hasFlexibleNegation(l)!==hasFlexibleNegation(r)) return false;
 const shorter=l.length<=r.length?l:r, longer=l.length<=r.length?r:l;
 if(!shorter.includes(' ')&&shorter.length<4) return false;
 return (` ${longer} `).includes(` ${shorter} `);
}
function countMatchesFlexible(givenList, answerGroups){
 let matches=0; const used=new Set();
 answerGroups.forEach(group=>{ for(let i=0;i<givenList.length;i++){ if(used.has(i)) continue; const g=normalizeText(givenList[i]); if(!g) continue; if(group.some(ans=>flexiblePhraseMatch(g,ans))){ used.add(i); matches++; break; } } });
 return matches;
}
"""
          if old not in s: raise SystemExit('Exercise 3 matcher anchor missing')
          s=s.replace(old,new,1)
          old2="function overlapCount(text, sourceWords){const userWords=normalizeText(text).split(' '); return sourceWords.filter(w=>w.length>4&&userWords.includes(w)).length;}"
          new2="function overlapCount(text, sourceWords){const userWords=new Set(normalizeText(text).split(' ').filter(Boolean)); const sourceUnique=new Set(sourceWords.filter(Boolean)); return Array.from(sourceUnique).filter(w=>w.length>4&&userWords.has(w)).length;}"
          if old2 not in s: raise SystemExit('Exercise 4 overlap anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - run: node --test tests/*.test.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "fix: harden Paraphrasing note and overlap scoring"
          git push
