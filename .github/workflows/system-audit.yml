name: System Audit
on:
  push:
    branches: [main, fix/system-audit-20261014, fix/third-hardening-audit-20261014, fix/fourth-hardening-audit-20261014]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply duplicate-model fix
        if: github.ref == 'refs/heads/fix/fourth-hardening-audit-20261014'
        run: python scripts/fix_duplicate_model.py
      - name: Commit duplicate-model fix
        if: github.ref == 'refs/heads/fix/fourth-hardening-audit-20261014'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep paraphrase models distinct"
          git push
      - run: node --test tests/*.test.mjs
