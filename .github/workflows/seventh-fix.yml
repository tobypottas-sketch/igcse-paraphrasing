name: Apply Seventh Audit Paraphrasing Fix
on:
  push:
    branches:
      - audit/seventh-hardening-20261015
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seventh-hardening-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .audit7_patch.py
      - run: node --test tests/*.test.mjs
      - run: |
          git config user.name "Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply Audit #7 Paraphrasing scoring fixes"
          git push origin HEAD:audit/seventh-hardening-20261015
