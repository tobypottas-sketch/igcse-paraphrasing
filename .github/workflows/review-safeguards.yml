name: Review Safeguards

on:
  push:
    branches:
      - fix/review-safeguards

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-ex3-ex4-exam-safeguards.mjs
      - run: node --test tests/review-safeguards.test.mjs tests/exam-mode-safeguards.test.mjs
      - name: Commit generated fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: neutralise Exercise 3 and 4 Exam feedback"
          git push
