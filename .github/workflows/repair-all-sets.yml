name: Repair all practice sets
on:
  push:
    branches: [fix/restore-paraphrasing-sets-20261016]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-paraphrasing-sets-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore missing word-count helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          marker = "function wordCount(text){return text.trim()?text.trim().split(/\\s+/).length:0;}"
          helper = """function updateWordCount(i){
           const setId='set'+(i+1);
           const input=document.getElementById(`${setId}_summary`);
           const counter=document.getElementById(`${setId}_wc`);
           if(!input || !counter) return;
           counter.textContent=wordCount(input.value);
          }
          """
          if 'function updateWordCount(i)' not in text:
              if marker not in text:
                  raise SystemExit('wordCount anchor not found')
              text = text.replace(marker, helper + marker, 1)
              path.write_text(text)
          PY
      - name: Run full regression suite
        run: node --test tests/*.test.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name "tobypottas-sketch"
          git config user.email "toby.pottas@gmail.com"
          git add index.html
          git commit -m "Fix practice-set rendering after Set 1"
          git push origin HEAD:fix/restore-paraphrasing-sets-20261016
