name: Cambridge Style Refresh

on:
  push:
    branches:
      - style/cambridge-suite-refresh

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/cambridge-style-refresh.test.mjs
