name: Cambridge Style Refresh

on:
  push:
    branches:
      - style/cambridge-suite-refresh

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-cambridge-style-refresh.mjs
      - run: node --test tests/cambridge-style-refresh.test.mjs
      - name: Commit generated refresh
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "style: match Cambridge 0511 app suite"
          git push
