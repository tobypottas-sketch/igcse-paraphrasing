name: Temporary Back to Hub patch
on:
  push:
    branches: [feat/back-to-hub-20261016]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/back-to-hub-20261016
      - name: Add Back to Hub control
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'class="hub-return-link"' in text:
              raise SystemExit('Back to Hub control already exists')
          css = '''\n<style>\n/* Shared Self-Study Hub return control */\n.hub-return-bar{max-width:1320px;margin:10px auto 0;padding:0 20px;display:flex;justify-content:flex-end;position:relative;z-index:1200}\n.hub-return-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #b9dedd;border-radius:999px;background:#fff;color:#176f70;text-decoration:none;font:700 .82rem/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;box-shadow:0 2px 8px rgba(25,72,75,.08);transition:background .15s,border-color .15s,transform .15s}\n.hub-return-link:hover{background:#eaf8f7;border-color:#88c8c5}\n.hub-return-link:focus-visible{outline:3px solid rgba(20,155,150,.22);outline-offset:2px}\n@media(max-width:700px){.hub-return-bar{margin-top:8px;padding:0 10px}.hub-return-link{padding:8px 12px;font-size:.78rem}}\n</style>\n'''
          if '</head>' not in text.lower():
              raise SystemExit('No </head> found')
          text = re.sub(r'</head>', css + '</head>', text, count=1, flags=re.I)
          bar = '''\n<div class="hub-return-bar" aria-label="Hub navigation"><a class="hub-return-link" href="https://tobypottas-sketch.github.io/igcse-self-study-hub/" target="_top" rel="noopener">← Back to Hub</a></div>\n'''
          text, count = re.subn(r'(<body\b[^>]*>)', r'\1' + bar, text, count=1, flags=re.I)
          if count != 1:
              raise SystemExit('No <body> found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Back to Hub navigation"
          git push origin HEAD:feat/back-to-hub-20261016
