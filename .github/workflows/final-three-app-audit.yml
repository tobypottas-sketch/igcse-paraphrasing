name: Final Three App Audit

on:
  push:
    branches:
      - fix/final-three-app-audit

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-final-three-app-audit.mjs
      - run: node --test tests/final-three-app-audit.test.mjs tests/final-exam-audit.test.mjs tests/exam-hardening.test.mjs tests/review-safeguards.test.mjs tests/exam-mode-safeguards.test.mjs
      - name: Commit generated fixes
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: close final Paraphrasing completion gaps"
          git push
